services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka-server:
    build: ./eureka-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EUREKA_PORT:-8761}:8761"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8

  ms-auth:
    build: ./ms-auth
    restart: unless-stopped
    environment: &service-environment
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_Auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION: 900000
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  ms-users:
    build: ./ms-users
    restart: unless-stopped
    environment:
      <<: *service-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_users?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  ms-classes:
    build: ./ms-classes
    restart: unless-stopped
    environment:
      <<: *service-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_classes?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  ms-plans:
    build: ./ms-plans
    restart: unless-stopped
    environment:
      <<: *service-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_plans?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  ms-subscription:
    build: ./ms-subscription
    restart: unless-stopped
    environment:
      <<: *service-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_subscription?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  ms-reservations:
    build: ./ms-reservations
    restart: unless-stopped
    environment:
      <<: *service-environment
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_REPAIR_ON_MIGRATE: "true"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_Reservations?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  ms-assistance:
    build: ./ms-assistance
    restart: unless-stopped
    environment:
      <<: *service-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_assistance?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  ms-apigateway:
    build: ./ms-apiGateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8090}:8090"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      eureka-server:
        condition: service_healthy

volumes:
  mysql_data:
